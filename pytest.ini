[pytest]
# Pytest configuration for Watershed-UP project

# Python files
python_files = test_*.py *_test.py

# Python classes
python_classes = Test*

# Python functions
python_functions = test_*

# Test discovery patterns
testpaths = tests

# Minimum Python version
minversion = 7.0

# Add project root to Python path
pythonpath = . ml

# Output options
addopts =
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers
    --strict-markers
    # Strict config
    --strict-config
    # Show warnings
    -W default
    # Verbose output
    -v
    # Show print statements
    -s
    # Coverage options (when using pytest-cov)
    # --cov=backend/app
    # --cov=ml/src
    # --cov-report=html
    # --cov-report=term-missing

# Markers for organizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take a long time to run
    api: API endpoint tests
    ml: Machine learning pipeline tests
    preprocessing: Data preprocessing tests
    feature: Feature engineering tests
    model: Model training/prediction tests
    watershed: Watershed analysis tests

# Ignore directories
norecursedirs =
    .git
    .venv
    venv
    env
    ENV
    __pycache__
    *.egg-info
    dist
    build
    node_modules
    data
    models
    backups
    docs/archive

# Timeout for tests (in seconds)
timeout = 300

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
