[tool.black]
# Black configuration for Watershed-UP project

line-length = 100
target-version = ['py311']
include = '\.pyi?$'

exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | ENV
  | __pycache__
  | \.pytest_cache
  | \.mypy_cache
  | build
  | dist
  | \.eggs
  | .*\.egg-info
  | node_modules
  | data
  | models
  | backups
  | docs/archive
)/
'''

[tool.pylint.main]
# Pylint configuration

# Maximum line length
max-line-length = 100

# Minimum Python version
py-version = "3.11"

# Disable specific warnings
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "invalid-name",
    "line-too-long",
]

# Files to ignore
ignore = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    "ENV",
    "build",
    "dist",
    ".eggs",
    "node_modules",
    "data",
    "models",
    "backups",
    "docs",
]

# Good variable names
good-names = ["i", "j", "k", "ex", "Run", "_", "x", "y", "df", "ax", "id"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
# Naming conventions
argument-naming-style = "snake_case"
attr-naming-style = "snake_case"
class-naming-style = "PascalCase"
const-naming-style = "UPPER_CASE"
function-naming-style = "snake_case"
method-naming-style = "snake_case"
module-naming-style = "snake_case"
variable-naming-style = "snake_case"
